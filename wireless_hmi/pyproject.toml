[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whmi"
version = "0.1.0"
description = "Wireless industrial HMI: receiver/gateway service, panel runtime and engineering tools"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "pycomm3>=1.2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[project.scripts]
whmi = "whmi.tools.cli:main"
whmi-receiver = "whmi.receiver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
