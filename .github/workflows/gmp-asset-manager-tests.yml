name: GMP Asset Manager tests

on:
  push:
    paths:
      - "GMP_ASSET_MANAGER/**"
      - ".github/workflows/gmp-asset-manager-tests.yml"
  pull_request:
    paths:
      - "GMP_ASSET_MANAGER/**"
      - ".github/workflows/gmp-asset-manager-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: GMP_ASSET_MANAGER/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r GMP_ASSET_MANAGER/requirements.txt

      - name: Run tests
        working-directory: GMP_ASSET_MANAGER
        run: python -m pytest -q tests
